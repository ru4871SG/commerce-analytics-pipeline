models:
  - name: stg_crm__customers
    description: One row per customer, all brands. Email is never copied to bronze.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [brand, customer_id]
    columns:
      - name: brand
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('brands')
                field: brand

  - name: stg_crm__orders
    description: One row per order (carts included) for every brand. Flags are booleans, amounts are in cents.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [brand, order_id]
    columns:
      - name: brand
        description: Brand key from the brand registry (seeds/brands.csv).
        data_tests:
          - not_null
          - relationships:      # a brand loaded into RAW but missing from the registry
              arguments:
                to: ref('brands')
                field: brand
      - name: order_id
        data_tests:
          - not_null
      - name: order_date
        description: Calendar date the order was created (UTC).
        data_tests:
          - not_null

  - name: stg_crm__order_items
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [brand, order_item_id]

  - name: stg_crm__products
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [brand, product_id]

  - name: stg_crm__product_variants
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [brand, variant_id]
    columns:
      - name: purchase_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['Subscribe', 'Upsell', 'One-Time Purchase']

  - name: stg_crm__product_costs
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [brand, sku]

  - name: stg_crm__processing_costs
    description: One row per brand with the per-order processing costs, in cents.
    columns:
      - name: brand
        data_tests:
          - unique
          - not_null

  - name: stg_crm__refund_payments
    description: One row per refund payment. refund_amount_excl_vat is in currency units, VAT removed where prices include it.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [brand, refund_payment_id]

  - name: int_order_item_costs
    description: Cost of every order line of a non-cart order, in cents. NULL when the product has no cost SKU.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [brand, order_item_id]

  - name: int_order_costs
    description: Cost of every non-cart order in cents, summed from its lines.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [brand, order_id]
    columns:
      - name: cost_of_order_cents
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
              config:
                severity: warn     # a negative cost means a bad product cost row, not a broken pipeline

  - name: int_order_first_items
    description: The first item of every order, with its product name and warehouse SKU.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [brand, order_id]

  - name: stg_crm__marketing_spend
    description: One row per brand, day, channel, medium and campaign of ad spend, in cents of the brand's currency.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [brand, spend_date, utm_source, utm_medium, utm_campaign]
    columns:
      - name: spend_cents
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: stg_crm__orders_changes
    description: Every version of an order the loader has copied, with its state columns.
    columns:
      - name: updated_at
        data_tests: [not_null]

  # The change data capture is a side load: every test on its models warns, so none can fail the build
  - name: stg_crm__orders_cdc
    description: >
      Every insert, update and delete of an order that the change data capture read from
      PostgreSQL's write-ahead log (source crm.orders_cdc), with the columns that describe the
      order's state. A delete carries the order's id only. Empty until the first capture.
    data_tests:
      # A change is one record of the log: its brand, its place in the log and the row's id name it
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [brand, lsn_number, order_id]
          config:
            severity: warn
    columns:
      - name: order_id
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: operation_code
        description: I, U or D, as wal2json names an insert, an update and a delete.
        data_tests:
          - accepted_values:
              arguments:
                values: ["I", "U", "D"]
              config:
                severity: warn
      - name: lsn_number
        description: The change's place in the write-ahead log as a number. Changes happened in this order.
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: committed_at
        description: When the transaction that made the change committed, UTC.
      - name: updated_at
        description: The order's updated_at after the change. NULL for a delete.
        data_tests:
          - not_null:
              config:
                severity: warn
                where: "operation_code <> 'D'"
      - name: captured_at
        description: When the capture that read the change started, UTC.

  - name: stg_web__daily_funnel
    description: >
      The storefront funnel per brand, New York day, channel and device, from the lakehouse
      (source web.daily_funnel). Session counts add up across days, channels and devices.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [brand, business_date, channel, device]
    columns:
      - name: brand
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('brands')
                field: brand
      - name: engine
        description: The engine that last rebuilt the day, pandas or spark.
        data_tests:
          - accepted_values:
              arguments:
                values: ['pandas', 'spark']
      - name: sessions
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1

  # The exchange rates come from a side load (source ref.fx_rates), which the report never waits
  # for. Their tests warn: a rate that is late or odd must show, and must not stop gold.
  - name: stg_ref__fx_rates
    description: >
      One row per currency and day the ECB published a rate, from the seed fx_rates_ecb and from
      RAW.REF.FX_RATES, with what one unit of the currency was worth in US dollars that day.
      Source: ECB statistics.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [currency_code, rate_date]
          config:
            severity: warn
    columns:
      - name: eur_rate
        description: Units of the currency per one euro, as the ECB published it.
      - name: usd_per_unit
        description: US dollars per one unit of the currency. The USD rate per euro divided by the currency's own; 1 for USD.
        data_tests:
          - not_null:
              config:
                severity: warn
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
              config:
                severity: warn

  - name: int_fx_rates_daily
    description: >
      One row per currency and calendar day, from the first published rate to the latest order
      or refund: the rate that day's amounts are converted at. A day with no rate of its own (a
      weekend, a TARGET holiday, a day the load did not run) takes the latest rate before it.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [currency_code, date_day]
          config:
            severity: warn
    columns:
      - name: date_day
        description: The calendar day the rate applies to.
      - name: rate_date
        description: The day the rate was published for, on or before date_day. Never after it.
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: days_carried_forward
        description: >
          How many days old the rate is: 0 on a day with its own, 1 and 2 over a weekend, up to 4
          over Easter. More than 5 means the load has not brought a rate for days.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 5
              config:
                severity: warn
      - name: usd_per_unit
        description: US dollars per one unit of the currency at that rate.
        data_tests:
          - not_null:
              config:
                severity: warn
